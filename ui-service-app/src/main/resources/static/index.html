<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; margin-bottom: 8px; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #aaa; cursor: not-allowed; }

        #status {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 16px;
            min-height: 28px;
        }
        #status.win-x { color: #e74c3c; }
        #status.win-o { color: #2980b9; }
        #status.draw  { color: #7f8c8d; }

        table { border-collapse: collapse; margin-bottom: 20px; }
        td {
            width: 90px;
            height: 90px;
            border: 3px solid #555;
            text-align: center;
            vertical-align: middle;
            font-size: 42px;
            font-weight: bold;
            background: #fff;
        }
        td.x { color: #e74c3c; }
        td.o { color: #2980b9; }
        td.winner { background: #fef9c3; }
        td.just-placed { animation: pop 0.25s ease; }
        @keyframes pop {
            0%   { transform: scale(0.4); opacity: 0.3; }
            70%  { transform: scale(1.15); }
            100% { transform: scale(1);   opacity: 1; }
        }

        #history h3 { margin: 0 0 8px; font-size: 15px; color: #555; }
        #moveList {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        #moveList li {
            background: #fff;
            padding: 3px 10px;
            border-radius: 3px;
            border: 1px solid #ddd;
            font-family: monospace;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #moveList li.visible { opacity: 1; }

        #error {
            color: #c0392b;
            background: #fdecea;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Distributed Tic Tac Toe</h1>

    <button id="startBtn" onclick="startSimulation()">&#9654; Start Simulation</button>
    <div id="error"></div>
    <div id="status"></div>
    <div id="board"></div>
    <div id="history" style="display:none">
        <h3>Move history</h3>
        <ul id="moveList"></ul>
    </div>

    <script>
        const GATEWAY = 'http://localhost:8080';

        const WIN_CONDITIONS = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        async function startSimulation() {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            clearError();
            setStatus('');
            renderEmptyBoard();
            clearHistory();

            let prevBoard = '         '; // 9 spaces — empty board
            let lastGame  = null;

            try {
                setStatus('Creating session…');
                const sessionRes = await fetch(GATEWAY + '/api/sessions', { method: 'POST' });
                if (!sessionRes.ok) throw new Error('Failed to create session: ' + sessionRes.status);
                const session = await sessionRes.json();

                setStatus('Simulating…');
                document.getElementById('history').style.display = 'block';

                // POST to simulate — session service returns SSE stream as chunked response.
                // EventSource only supports GET, so we consume the stream with fetch + ReadableStream.
                await consumeSSE(
                    GATEWAY + '/api/sessions/' + session.sessionId + '/simulate',
                    'POST',
                    (eventName, data) => {
                        if (eventName === 'move') {
                            const game = JSON.parse(data);
                            const move = detectMove(prevBoard, game.board);
                            if (move) {
                                updateCell(move.position, move.player);
                                appendMoveHistory(move.player, move.position);
                            }
                            prevBoard = game.board;
                            lastGame  = game;
                        }
                        // 'done' event signals end — the stream closes naturally after it
                    }
                );

                if (lastGame) {
                    const winLine = findWinningLine(lastGame.board);
                    if (winLine) winLine.forEach(idx => highlightCell(idx));
                    showFinalStatus(lastGame.status);
                }

            } catch (err) {
                showError(err.message);
                setStatus('');
            } finally {
                btn.disabled = false;
            }
        }

        /**
         * Reads an SSE stream from an arbitrary HTTP method using fetch + ReadableStream.
         * Calls onEvent(eventName, data) for each complete SSE event received.
         */
        async function consumeSSE(url, method, onEvent) {
            const response = await fetch(url, { method });
            if (!response.ok) throw new Error('Simulation request failed: ' + response.status);

            const reader  = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                // SSE events are separated by a blank line (\n\n)
                const chunks = buffer.split('\n\n');
                buffer = chunks.pop(); // keep the incomplete trailing chunk

                for (const chunk of chunks) {
                    if (!chunk.trim()) continue;
                    let eventName = 'message';
                    let data = '';
                    for (const line of chunk.split('\n')) {
                        if (line.startsWith('event:')) eventName = line.slice(6).trim();
                        else if (line.startsWith('data:'))  data      = line.slice(5).trim();
                    }
                    onEvent(eventName, data);
                }
            }
        }

        // Returns {position, player} for the cell that changed between two board strings
        function detectMove(prevBoard, newBoard) {
            for (let i = 0; i < 9; i++) {
                if (prevBoard[i] === ' ' && newBoard[i] !== ' ') {
                    return { position: i, player: newBoard[i] };
                }
            }
            return null;
        }

        function renderEmptyBoard() {
            const container = document.getElementById('board');
            let html = '<table>';
            for (let row = 0; row < 3; row++) {
                html += '<tr>';
                for (let col = 0; col < 3; col++) {
                    html += '<td id="cell-' + (row * 3 + col) + '"></td>';
                }
                html += '</tr>';
            }
            html += '</table>';
            container.innerHTML = html;
        }

        function updateCell(index, player) {
            const td = document.getElementById('cell-' + index);
            if (!td) return;
            td.textContent = player;
            td.className = player.toLowerCase() + ' just-placed';
            td.addEventListener('animationend', () => td.classList.remove('just-placed'), { once: true });
        }

        function highlightCell(index) {
            const td = document.getElementById('cell-' + index);
            if (td) td.classList.add('winner');
        }

        function appendMoveHistory(player, position) {
            const list = document.getElementById('moveList');
            const li = document.createElement('li');
            li.textContent = (list.children.length + 1) + '. ' + player + ':' + position;
            list.appendChild(li);
            requestAnimationFrame(() => li.classList.add('visible'));
        }

        function clearHistory() {
            document.getElementById('moveList').innerHTML = '';
            document.getElementById('history').style.display = 'none';
        }

        function setStatus(msg, cls) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = cls || '';
        }

        function showFinalStatus(gameStatus) {
            const map = {
                'X_WON': ['Player X wins!', 'win-x'],
                'O_WON': ['Player O wins!', 'win-o'],
                'DRAW':  ["It's a draw!",   'draw'],
            };
            const [msg, cls] = map[gameStatus] || [gameStatus, ''];
            setStatus(msg, cls);
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearError() {
            const el = document.getElementById('error');
            el.style.display = 'none';
            el.textContent = '';
        }

        function findWinningLine(board) {
            for (const [a, b, c] of WIN_CONDITIONS) {
                if (board[a] !== ' ' && board[a] === board[b] && board[b] === board[c]) {
                    return [a, b, c];
                }
            }
            return null;
        }

        // Show empty board immediately on page load
        renderEmptyBoard();
    </script>
</body>
</html>
