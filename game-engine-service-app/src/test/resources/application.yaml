spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:gameenginedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false
